[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-inspiration-assistant-backend"
version = "0.1.0"
description = "日常灵感智能助手 FastAPI 后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "asyncmy>=0.2.10,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
  "mcp==1.28.1",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6.1,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
rag-infra = [
  "minio>=7.2,<8",
  "pymilvus>=2.6,<2.7",
  "redis>=6.4,<7",
]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
